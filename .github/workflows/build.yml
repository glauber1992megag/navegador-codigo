name: Gerar APK Navegador Dev

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aceitar licenças do Android
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Apache Cordova
        run: npm install -g cordova

      - name: Criar e compilar aplicativo Android
        run: |
          cordova create temp_app com.dev.navegadorcodigo "Navegador Dev"
          rm -rf temp_app/www/*
          cp -r www/* temp_app/www/
          cp config.xml temp_app/
          cd temp_app
          cordova platform add android
          cordova plugin add cordova-plugin-inappbrowser
          cordova build android

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Navegador-Dev-APK
          path: "**/app-debug.apk"
          if-no-files-found: error
